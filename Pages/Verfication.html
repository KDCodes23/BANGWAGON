<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Verification</title>
    <link rel="stylesheet" href="/Styles/Veri.css">
    <link rel="stylesheet" href="/Styles/home.css">
    <style>
        /* Add these styles to your Veri.css */
        .data-field { margin-bottom: 8px; }
        .data-label { font-weight: bold; color: #666; }
        .data-value { color: #333; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Election App</div>
            <ul>
                <li><a href="/Pages/HomePage.html">Home</a></li>
                <li><a href="/Pages/Verfication.html">Verify Me</a></li>
                <li><a href="/Pages/Candidates.html">Candidates</a></li>
                <li><a href="/Pages//Voting.html">Voting</a></li>                
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="camera-preview" id="cameraPreview">
            <video id="video" width="100%" height="100%" autoplay></video>
        </div>

        <!-- Single license input -->
        <input type="text" class="license-input" 
               placeholder="Driver's License Number"
               id="licenseInput" readonly>

        <button class="capture-button" id="captureLicense">Capture License</button>
        <div class="preview-container">
            <img src="#" class="image-preview" id="licensePreview" alt="License preview">
        </div>

        <button class="capture-button" id="captureFace">Capture Face</button>
        <div class="preview-container">
            <img src="#" class="image-preview" id="facePreview" alt="Face preview">
        </div>

        <!-- Single result text container -->
        <div class="result-text" id="resultText">
            <div class="data-field">
                <span class="data-label">Name:</span>
                <span class="data-value" id="nameValue">Not found</span>
            </div>
            <div class="data-field">
                <span class="data-label">Date of Birth:</span>
                <span class="data-value" id="dobValue">Not found</span>
            </div>
            <div class="data-field">
                <span class="data-label">Address:</span>
                <span class="data-value" id="addressValue">Not found</span>
            </div>
        </div>
    </div>

    <script>
        // Modified captureLicense function with error handling improvements
        async function captureLicense() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                licensePreview.src = canvas.toDataURL('image/jpeg');
                licensePreview.style.display = 'block';
                
                // Convert canvas to Blob for better handling
                canvas.toBlob(async (blob) => {
                    try {
                        const reader = new FileReader();
                        reader.onloadend = async () => {
                            const base64data = reader.result;
                            
                            const response = await fetch('http://localhost:5000/process-license', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                },
                                body: JSON.stringify({
                                    image: base64data.split(',')[1] // Send only the base64 data
                                })
                            });
    
                            if (!response.ok) {
                                const error = await response.text();
                                throw new Error(`Server error: ${error}`);
                            }
    
                            const data = await response.json();
                            console.log('Server response:', data); // Debug log
    
                            if (data.success) {
                                licenseInput.value = data.license_number || '';
                                document.getElementById('nameValue').textContent = data.full_name || 'Not found';
                                document.getElementById('dobValue').textContent = data.dob || 'Not found';
                                document.getElementById('addressValue').textContent = data.address || 'Not found';
                            } else {
                                throw new Error(data.error || 'Data extraction failed');
                            }
                        };
                        reader.readAsDataURL(blob);
                        
                    } catch (error) {
                        console.error('Processing Error:', error);
                        showError(error.message);
                    }
                }, 'image/jpeg', 0.8);
                
            } catch (error) {
                console.error('Capture Error:', error);
                showError(error.message);
            }
        }
    
        // Add error event listeners
        video.addEventListener('error', (e) => {
            console.error('Video Error:', e);
            showError('Video stream error');
        });
    
        // Updated initCamera with better device selection
        async function initCamera() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                
                const constraints = {
                    video: {
                        deviceId: videoDevices[0].deviceId,
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 30 }
                    }
                };
                
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                // Add loadedmetadata handler
                await new Promise((resolve) => {
                    video.addEventListener('loadedmetadata', () => {
                        video.play();
                        resolve();
                    });
                });
                
            } catch (error) {
                console.error('Camera Error:', error);
                handleCameraError(error);
            }
        }
    </script>
</body>
</html>
