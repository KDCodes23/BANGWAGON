<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote Page</title>
    <link rel="stylesheet" href="/Styles/vote.css">
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="/Pages/HomePage.html">Home</a></li>
                <li><a href="/Pages/Verfication.html">Verify Me</a></li>
                <li><a href="/Pages/Candidates.html">Candidates</a></li>
                <li><a href="/Pages/Voting.html">Voting</a></li>                
            </ul>
        </nav>
    </header>

    <div class="container">
        <form action="" method="post">
            <button type="button">
                <p>Progresive Conservative:</p>
                <p>Doug Ford</p>
                <img src="/Aseets/DougFord2.jpeg" alt="Doug Ford">
            </button>
       
            <button type="button">
                <p>Liberal Party:</p>
                <p>Bonnie Crombie</p>
                <img src="/Aseets/8c7dc827adf0f59f75be23feafe601f8b5010b9073d4d103c0f5f940f78abd47.jpg" alt="Bonnie Crombie">
            </button>
        
            <button type="button">
                <p>New Democratic Party:</p>
                <p>Marit Stiles</p>
                <img src="/Aseets/marit-stiles-ontario-ndp-leader.avif" alt="Marit Stiles">
            </button>
       
            <button type="button">
                <p>Green Party:</p>
                <p>Mike Schreiner</p>
                <img src="/Aseets/gpo-mike-schreiner-headshot-2021-bricks-1.jpg" alt="Mike Schreiner">
            </button>
       
            <button type="submit">Submit</button>
        </form>
    </div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
    const buttons = document.querySelectorAll("form button:not([type='submit'])");

    buttons.forEach(button => {
        button.addEventListener("click", function (event) {
            event.preventDefault(); 
            
            // Remove 'selected' class from all buttons
            buttons.forEach(btn => btn.classList.remove("selected"));

            // Add 'selected' class to the clicked button
            button.classList.add("selected");
        });
    });
});
</script>
</body>
</html>
